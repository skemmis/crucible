name: Implement Consensus

on:
  issues:
    types: [labeled]

jobs:
  implement:
    # Only run when the `consensus-reached` label is added
    if: github.event.label.name == 'consensus-reached'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push new branch + commit files
      issues: write     # add `implementing` label + post comment
      pull-requests: write  # create PR

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CRUCIBLE_GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install orchestrator dependencies
        working-directory: orchestrator
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "Crucible Bot"
          git config user.email "crucible-bot@users.noreply.github.com"

      - name: Create implementation branch
        id: branch
        run: |
          BRANCH="implement/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run implementation script
        working-directory: orchestrator
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.CRUCIBLE_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pass the repo root so the script knows where game source files live
          REPO_ROOT: ${{ github.workspace }}
        run: npx tsx scripts/implement.ts

      - name: Check for changes
        id: changes
        run: |
          # Stage everything first (new files won't show in git diff HEAD unstaged)
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git commit -m "feat: implement consensus from issue #${{ github.event.issue.number }}

          Auto-generated by the Crucible implementation pipeline.
          Closes #${{ github.event.issue.number }}"
          git push origin "${{ steps.branch.outputs.name }}" \
            -u --force-with-lease

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CRUCIBLE_GITHUB_TOKEN }}
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          PR_URL=$(gh pr create \
            --title "feat: implement #${{ github.event.issue.number }} — ${{ github.event.issue.title }}" \
            --body-file orchestrator/implement-pr-body.md \
            --base "$DEFAULT_BRANCH" \
            --head "${{ steps.branch.outputs.name }}")
          echo "PR created: $PR_URL"

          # Add implementing label to the issue
          gh issue edit ${{ github.event.issue.number }} --add-label "implementing"

          # Post a comment on the issue linking to the PR
          gh issue comment ${{ github.event.issue.number }} \
            --body "🤖 **Implementation PR opened:** $PR_URL

          The Crucible implementation pipeline has generated code based on the consensus above. \
          Please review the PR and merge when ready."

      - name: Handle no changes
        if: steps.changes.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.CRUCIBLE_GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "⚠️ **Implementation pipeline ran but produced no file changes.**

          This can happen if the consensus describes a design decision rather than a code change, \
          or if the proposal was already implemented. Check the workflow logs for details."
